<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;width:100%;height:100%;font:14px sans-serif;background:#152238;color:white}button{margin:4px;padding:6px}</style></head><body><button id="click">Open</button><button id="expand">Expand</button><button id="resize">Resize</button><button id="rotate">Portrait</button><button id="video">Video</button><button id="close">Close</button><button id="invalid">Error</button><output id="events"></output><script>
(function(){var out=document.getElementById('events');function log(value){out.value=(out.value+' '+value).trim()}['ready','stateChange','viewableChange','exposureChange','audioVolumeChange','error'].forEach(function(name){mraid.addEventListener(name,function(){log(name)})});document.getElementById('click').onclick=function(){mraid.open('{{BASE_URL}}/landing/banner')};document.getElementById('expand').onclick=function(){mraid.setExpandProperties({width:360,height:600,useCustomClose:true});mraid.expand()};document.getElementById('resize').onclick=function(){mraid.setResizeProperties({width:300,height:250,offsetX:10,offsetY:20,customClosePosition:'top-right',allowOffscreen:false});mraid.resize()};document.getElementById('rotate').onclick=function(){mraid.setOrientationProperties({allowOrientationChange:false,forceOrientation:'portrait'})};document.getElementById('video').onclick=function(){mraid.playVideo('{{BASE_URL}}/media/test-card.mp4')};document.getElementById('close').onclick=function(){mraid.close()};document.getElementById('invalid').onclick=function(){mraid.setResizeProperties({width:0})}})();
</script></body></html>
