<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;width:100%;height:100%;display:grid;place-items:center;background:#32174d;color:white;font:18px sans-serif}main{text-align:center}button{margin:8px;padding:12px}</style></head><body><main><p>Engage interstitial fixture</p><button id="open">Open</button><button id="landscape">Landscape</button><button id="close">Close</button><button id="unload">Unload</button><output id="visibility"></output></main><script>
mraid.addEventListener('exposureChange',function(percent){document.getElementById('visibility').value=percent+'%'});document.getElementById('open').onclick=function(){mraid.open('{{BASE_URL}}/landing/interstitial')};document.getElementById('landscape').onclick=function(){mraid.setOrientationProperties({allowOrientationChange:false,forceOrientation:'landscape'})};document.getElementById('close').onclick=function(){mraid.close()};document.getElementById('unload').onclick=function(){mraid.unload()};
</script></body></html>
